<!doctype html>
<html lang="pt-br" class="">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Marto DevCard</title>
    <meta
      name="description"
      content="Página pessoal de Gabriel Martorelli – links para GitHub, LinkedIn, Portfólio e redes sociais."
    />

    <meta property="og:site_name" content="Marto DevCard" />
    <meta property="og:title" content="Marto DevCard" />
    <meta
      property="og:description"
      content="Página pessoal de Gabriel Martorelli – links para GitHub, LinkedIn, Portfólio e redes sociais."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.martodev.online" />

    <meta
      property="og:image"
      content="https://www.martodev.online/assets/foto-perfil.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="300" />
    <meta property="og:image:height" content="300" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz@0,14..32;1,14..32&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="profile">
        <img
          src="./assets/foto-perfil.png"
          alt="Foto de perfil de Gabriel Martorelli"
        />
        <p>Gabriel Martorelli</p>
      </div>
      <div id="switch">
        <button aria-label="Alternar tema claro/escuro"></button>
        <span></span>
      </div>
      <ul>
        <li>
          <a
            href="https://portfolio.martodev.online/"
            target="_blank"
            rel="noopener noreferrer"
            >Portfólio</a
          >
        </li>
        <li>
          <a href="https://crypto-monitor-fullstack.vercel.app/" target="_blank"
            >CryptoMonitor</a
          >
        </li>

        <li>
          <a href="https://github.com/martoxm/cashflow-api" target="_blank"
            >API de Controle de Despesas</a
          >
        </li>

        <li>
          <a href="https://github.com/martoxm/TaskManager" target="_blank"
            >API de Gerenciamento de Tarefas</a
          >
        </li>
      </ul>
      <div id="social-links">
        <a
          href="https://www.instagram.com/marto.dev/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="Instagram"
        >
          <ion-icon name="logo-instagram"></ion-icon
        ></a>
        <a
          href="https://github.com/martoxm"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <ion-icon name="logo-github"></ion-icon>
        </a>
        <a
          href="https://www.linkedin.com/in/gabrielmartorelli/"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="LinkedIn"
        >
          <ion-icon name="logo-linkedin"></ion-icon
        ></a>
      </div>
      <footer>© 2026 - Link In Bio de Gabriel Martorelli</footer>
    </div>
    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>
    <script src="./script.js"></script>
  </body>
</html>
